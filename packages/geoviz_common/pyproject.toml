[project]
name = "geoviz-common"
version = "0.1.0"
description = "Shared canvas utilities for geoviz map and paleo-map packages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoviz_common"]