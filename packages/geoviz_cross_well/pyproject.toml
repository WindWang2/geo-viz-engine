[project]
name = "geoviz-cross-well"
version = "0.1.0"
description = "Cross-well correlation with formation tops, manual picking, and DTW auto-correlation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin", email = "kevin@example.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6",
    "pydantic",
    "geoviz-well-log",
    "numpy",
]

[project.optional-dependencies]
# TWT checkshot calibration (soft-imported in seismic_tie).
well-tie = ["geoviz-well-tie"]
dev = ["pytest", "pytest-qt", "numpy", "scipy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoviz_cross_well"]

[tool.hatch.build.targets.sdist]
include = [
    "/geoviz_cross_well",
]
