[project]
name = "geoviz-paleo-map"
version = "0.1.0"
description = "QPainter-based paleogeographic map visualization for PySide6"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin", email = "kevin@example.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6",
    "pydantic",
    "geoviz-common",
    # Phase-2 T3: FilledContourLayer consumes BandedFill produced by
    # geoviz_plots.surface.marching_squares.extract_filled_contours. Acyclic -
    # geoviz_plots does not depend on geoviz_paleo_map.
    "geoviz-plots",
]

[project.optional-dependencies]
# Facies PatternEngine + rock textures (soft-imported). Core canvas works with solid fills.
patterns = ["geoviz-well-log"]
dev = ["pytest", "pytest-qt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoviz_paleo_map"]

[tool.hatch.build.targets.sdist]
include = ["/geoviz_paleo_map"]
