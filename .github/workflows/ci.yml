name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail fast on a hung step instead of burning the 6h GitHub job budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Qt offscreen / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      - name: Run fast test suite (no OpenGL/WebEngine)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        # Exit-code handling (#575): rc=134 (SIGABRT) is tolerated ONLY when
        # pytest demonstrably finished — the benign case is PySide6/Qt's
        # atexit EGL teardown firing AFTER the "N passed" summary. A 134
        # with no terminal summary means pytest aborted mid-suite: the run
        # did not complete, so the gate must fail instead of passing while
        # most tests silently never ran. Any other non-zero exit — notably
        # 139 (SIGSEGV) — fails outright (#272). PYTHONFAULTHANDLER=1 keeps
        # crash stacks traceable.
        run: |
          set +e
          uv run pytest -m "not slow" -q --tb=short --maxfail=5 --timeout=60 2>&1 | tee /tmp/pytest_out.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 134 ]; then
            if grep -qE '^[0-9]+ (passed|failed|error|skipped)|no tests ran' /tmp/pytest_out.txt; then
              echo "rc=134 AFTER pytest terminal summary — benign Qt atexit teardown"
              exit 0
            fi
            echo "::error::rc=134 WITHOUT a pytest terminal summary — pytest aborted mid-suite"
            exit 1
          fi
          exit "$rc"

  test-slow:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Job-level timeout: since 2026-08-04 every run hit the 6h GitHub job cap
    # and was CANCELLED because the slow pytest step hung on QtWebEngine
    # (Chromium) on the headless runner. Bound it here so a regression fails
    # fast with a visible timeout instead of silently burning hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Qt offscreen / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      # QtWebEngine (Chromium) hangs on headless GitHub Actions runners unless
      # the sandbox is disabled and software compositing is forced — this was
      # the root cause of every main-push run being CANCELLED at the 6h job
      # cap since 2026-08-04 (zero pytest output + orphaned QtWebEngineProcess
      # in the cancelled run logs; tests/test_chart_engine.py instantiates
      # QWebEngineView). Flags must be set before PySide6.QtWebEngineWidgets is
      # imported, hence job env below.
      - name: Run slow/OpenGL tests (best-effort)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
        # Per-test timeout: a single stuck WebEngine/GL test must fail with a
        # traceback rather than block the whole job until the job timeout.
        # Note: pytest-timeout's signal cannot interrupt a modal Qt dialog
        # (QFileDialog/QMessageBox exec loops in C++), so the job-level
        # timeout-minutes above is the ultimate backstop for those.
        # -v + unbuffered output: if a test does hang, the log shows the last
        # test that started instead of an opaque empty step.
        run: uv run python -u -m pytest -m slow -v --tb=short --maxfail=3 --timeout=600
