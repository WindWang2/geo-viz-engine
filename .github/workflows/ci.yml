name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast test suite (no OpenGL/WebEngine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv sync --extra dev && pytest -m "not slow" -q --tb=short --maxfail=5 --timeout=60

  test-slow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow/OpenGL tests (best-effort)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pytest -m slow -q --tb=short --maxfail=3