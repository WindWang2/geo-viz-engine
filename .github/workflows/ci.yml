name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      - name: Run fast test suite (no OpenGL/WebEngine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m "not slow" -q --tb=short --maxfail=5 --timeout=60

  test-slow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      - name: Run slow/OpenGL tests (best-effort)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: uv run pytest -m slow -q --tb=short --maxfail=3
