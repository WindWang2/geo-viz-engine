name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Qt offscreen / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      - name: Run fast test suite (no OpenGL/WebEngine)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        # Exit-code handling: ONLY 134 (SIGABRT) is tolerated — it comes
        # from PySide6/Qt's atexit EGL teardown on headless CI, AFTER pytest
        # has printed its "N passed" summary, and is benign. Any other
        # non-zero exit — notably 139 (SIGSEGV) — is a real crash and MUST
        # fail the gate (#272). PYTHONFAULTHANDLER=1 ensures the Python
        # stack is printed on a crash so the root cause is traceable.
        run: |
          set +e
          uv run pytest -m "not slow" -q --tb=short --maxfail=5 --timeout=60
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 134 ]; then exit 0; else exit "$rc"; fi

  test-slow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Qt offscreen / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (editable, with dev extras)
        run: uv sync --extra dev

      - name: Run slow/OpenGL tests (best-effort)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: uv run pytest -m slow -q --tb=short --maxfail=3
