[project]
name = "geo-viz-engine"
version = "0.14.0"
description = "地质数据可视化桌面引擎"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.6",
    "pyqtgraph>=0.13",
    "lasio>=0.14",
    "segyio>=1.9",
    "pandas>=2.0",
    "python-calamine>=0.2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "contourpy>=1.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pydantic>=2.0",
    "shapely>=2.0",
    "PyOpenGL>=3.1.0",
    "geoviz-well-log",
    "geoviz-seismic",
    "geoviz-map",
    "geoviz-paleo-map",
    "geoviz-cross-well",
    "geoviz-well-tie",
    "geoviz-plots",
    "geoviz-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "PyInstaller>=6.0",
]
gpu = [
    "cupy-cuda13x; sys_platform == 'linux' or sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoviz*"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]

[tool.uv.workspace]
members = [
    "packages/geoviz_well_log",
    "packages/geoviz_seismic",
    "packages/geoviz_map",
    "packages/geoviz_paleo_map",
    "packages/geoviz_cross_well",
    "packages/geoviz_well_tie",
    "packages/geoviz_plots",
    "packages/geoviz_common",
]

[tool.uv.sources]
geoviz-well-log = { workspace = true }
geoviz-seismic = { workspace = true }
geoviz-map = { workspace = true }
geoviz-paleo-map = { workspace = true }
geoviz-cross-well = { workspace = true }
geoviz-well-tie = { workspace = true }
geoviz-plots = { workspace = true }
geoviz-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/geoviz_cross_well/tests"]
qt_api = "pyside6"
markers = [
    "slow: OpenGL/WebEngine tests; skip in fast CI with -m 'not slow'",
]
asyncio_default_fixture_loop_scope = "function"
